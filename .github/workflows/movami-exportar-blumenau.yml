name: MOVAMI - Lista completa de empresas nao-MEI de Blumenau
on:
  push:
    paths:
      - '.github/workflows/movami-exportar-blumenau.yml'
      - 'movami/gerar_nomes_nao_mei_blumenau_github.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar DuckDB na nuvem
        run: python -m pip install --quiet 'duckdb>=1.4,<2'
      - name: Extrair empresas da Receita Federal
        run: python -u movami/gerar_nomes_nao_mei_blumenau_github.py
      - name: Publicar lista de nomes no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add movami/dados-blumenau/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar lista de empresas nao-MEI de Blumenau (Receita 2026-10)'
            git push
          fi
      - name: Salvar CSV para baixar sem instalar nada
        uses: actions/upload-artifact@v4
        with:
          name: MOVAMI-BLUMENAU-NOMES-NAO-MEI
          path: movami/dados-blumenau/*.csv
          retention-days: 30
