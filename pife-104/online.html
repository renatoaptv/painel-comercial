async function loadActiveMatches(silent){
 if(!accountReady||game||loadingActive)return;
 loadingActive=true;

 try{
  var data=await api("profile-active");

async function api(action,extra){
 var body=Object.assign({action:action,code:room,token:token},extra||{});
 if(!accountClient)throw Error("Entre na sua conta.");
 var auth=await accountClient.auth.getSession(),session=auth.data.session;

 var response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body),cache:"no-store"});
 var result=await response.json();
 if(!result.ok)throw new Error(result.error||"Não foi possível concluir a jogada.");
 return result;
}
async function doAction(action,extra){
 if(busy)return;busy=true;errText="";
 var epoch=sessionEpoch;
 try{
  audioStart();
  if(!accountReady)throw Error("Entre na sua conta para jogar.");
  var result=await api(action,extra);
  if(epoch!==sessionEpoch)return;
  if(result.cancelled){leaveRoom(false);return;}
  if(result.token){token=result.token;room=result.state.code;localStorage.setItem(STORAGE_KEY,JSON.stringify({code:room,token:token,accountId:accountId}));history.replaceState(null,"",link());}
  if(result.state)setState(result.state);
 }catch(e){if(epoch===sessionEpoch)showError(e.message);}
 finally{if(epoch===sessionEpoch){busy=false;render();}}
}
async function refresh(){
 if(polling||busy||!room||!token)return;polling=true;
 var epoch=sessionEpoch;
 try{
  var result=await api("state");
  if(epoch!==sessionEpoch)return;
  var hadError=!!errText;
  errText="";
  if(hadError||result.state.revision!==lastRevision||!game)setState(result.state);
 }catch(e){
  if(epoch===sessionEpoch){
   var msg=String(e.message||"");
   if(/Sala não encontrada|Essa sala expirou|Esta sala expirou/.test(msg)){
    leaveRoom(false);
    noticeText="A sala anterior não está mais disponível. Você pode retomar outra partida salva.";
    render();
    return;
   }
   if(accountReady&&/acesso a esta sala|Faça login na sala|Seu acesso/.test(msg)){
    try{
     var restored=await api("resume-profile",{code:room});
     if(epoch===sessionEpoch&&restored.token){
      token=restored.token;
      localStorage.setItem(STORAGE_KEY,JSON.stringify({code:room,token:token,accountId:accountId}));
      setState(restored.state);errText="";
     }
    }catch(recoveryError){errText=recoveryError.message;render();}
   }else{errText=msg;render();}
  }
 }
 finally{if(epoch===sessionEpoch)polling=false;}
}
