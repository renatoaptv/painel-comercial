function canWin9(h){
 if(h.length!==9)return false;
 var memo=new Map();
 function meld(a){
  if(a.length<3)return false;
  if(a.length===3 && a.every(function(x){return x.rank===a[0].rank;}) && new Set(a.map(function(x){return x.suit;})).size===3)return true;

  var ranks=a.map(function(x){return x.rank;});
  if(new Set(ranks).size!==a.length)return false;
  function c(ns){ns.sort(function(x,y){return x-y;});return ns.every(function(x,i){return i===0||x===ns[i-1]+1;});}

 var canInitial=ownTurn&&game.step==="draw"&&canWin9(mine);
 var title=ownTurn?"Sua vez de jogar":game.phase==="won"?"Rodada encerrada":"Suas cartas";
 var count=Math.max(9,mine.length);var cardWidth=Math.max(34,Math.min(73,Math.floor((Math.min(window.innerWidth,760)-38+(count-1)*13)/count)));var content='<section class="panel hand-panel"><div class="hand-title"><h2>'+title+'</h2><span class="turn-label">'+mine.length+' CARTAS · ARRASTE PARA ORGANIZAR</span></div><div class="hand" style="--count:'+count+';--card-width:'+cardWidth+'px" aria-label="Sua mão">'+ordered.map(card).join("")+'</div>';
 if(canDiscard)content+='<div class="dropzone" data-dropzone="discard">↓ SOLTE A CARTA AQUI PARA DESCARTAR ↓</div>';
 if(!ownTurn){content+='<p class="tip">'+(game.phase==="claim"?"Aguarde a conferência do descarte.":"Enquanto aguarda, você pode organizar suas cartas com o dedo.")+'</p>';}
 else if(game.step==="draw")content+='<p class="tip">Sua vez: compre do bolo ou do descarte. A compra também funciona tocando na mesa.</p><div class="controls">'+btn("Comprar do bolo","draw-stock","primary",game.drawCount===0)+(game.discardTop?btn("Pegar descarte","draw-discard","ghost"):btn("Sem descarte","x","ghost",true))+(canInitial?btn("BATER COM 9 CARTAS","initial-win","green full"): '')+'</div>';
 else if(canDiscard)content+='<p class="tip">Arraste a carta até DESCARTAR, ou toque na carta e use o botão abaixo.</p><div class="controls">'+btn("Descartar carta","discard","primary",!selection)+btn("BATER!","win","green",!goodWin)+(game.firstTurn&&game.turn===game.starter&&!game.specialUsed&&game.drawSource==="stock"?btn("Recusar 1ª compra","reject","ghost full"):"")+'</div>';
 content+='</section>';return content;
}
function currentStatus(){
 if(game.phase==="claim"&&game.pending){
  var waiting=Math.max(0,Math.ceil((game.pending.until-Date.now())/1000));
  return '<section class="panel"><span class="kicker">Descarte disponível</span><h2>'+(canClaim()?"Você pode bater nesta carta!":"Conferindo o descarte...")+'</h2><p class="lead">'+esc(game.players[game.pending.by].name)+' descartou '+esc(cardTitle(game.pending.card))+'. Outros jogadores podem bater durante esta janela.</p><div class="statusbar"><span class="pill">Prazo <strong id="claim-timer">'+waiting+'s</strong></span></div>'+(canClaim()?'<div class="controls">'+btn("BATER NO DESCARTE","claim","green full")+'</div>':"")+'</section>';
 }
 if(game.phase==="won"&&game.winner){
  var w=game.winner;var p=game.players[w.seat];
  var groups=(w.groups||[]).map(function(g){return '<div class="group">'+esc(g.kind)+'<div class="cards-mini">'+g.cards.map(function(c){return '<span class="mini-card '+(c.suit==="H"||c.suit==="D"?"red":"")+'">'+esc(cardTitle(c))+'</span>';}).join("")+'</div></div>';}).join("");
  return '<section class="panel waiting"><div class="spark">🏆</div><span class="kicker">Temos um vencedor!</span><h2>'+esc(p.name)+' bateu!</h2><p class="lead">'+esc(w.type)+'</p><div class="groups">'+groups+'</div>'+(game.seat===0?'<div class="controls">'+btn("Jogar próxima rodada","next-round","primary full")+'</div>':'<p class="lead">Aguarde o dono da sala iniciar a próxima rodada.</p>')+'</section>';
 }
 if(game.phase==="exhausted")return '<section class="panel waiting"><h2>Bolo esgotado</h2>'+(game.seat===0?'<div class="controls">'+btn("Nova rodada","next-round","primary full")+'</div>':'<p class="lead">Aguardando nova rodada.</p>')+'</section>';
 if(game.phase==="turn"&&game.turn!==game.seat)return '<section class="panel waiting"><span class="spinner"></span><strong>'+(game.players[game.turn].bot?'🤖 '+esc(game.players[game.turn].name)+' está jogando':'Vez de '+esc(game.players[game.turn].name))+'</strong><p class="tip">Sua mão continua visível somente para você.</p></section>';
 return "";
}
function render(){
 if(drag)return;
 if(!game)return showLanding();
 var body=header()+messageHtml();
 if(game.phase==="lobby")body+=renderLobby();
 else body+=board();
 if(voiceChat)body+=voiceChat.html();
 else body+='<div class="notice">Chat de voz indisponível. Atualize a página.</div>';
 if(game.phase!=="lobby")body+=currentStatus()+handView();
 body+='<footer class="footer">Mesa online · 2 a 4 participantes · Cartas privadas · Conversa por voz opcional</footer>';
 app.innerHTML=body;
}
function link(){return new URL("./online.html?s="+encodeURIComponent(room),location.href).href;}
function leaveRoom(){
 // Sair do aparelho não encerra a partida dos outros participantes.
 if(voiceChat)voiceChat.leave();
 sessionEpoch++;
 localStorage.removeItem(STORAGE_KEY);
 token="";room="";game=null;lastRevision=-1;selected="";order=[];
 busy=false;polling=false;drag=null;ignoreClick=false;errText="";noticeText="";
 try{history.replaceState(null,"",new URL("./online.html",location.href).href);}catch(_){}
 render();
}
function showError(msg){errText=String(msg||"Erro de conexão.");noticeText="";render();}
function setState(state){
 var old=game;
 game=state;room=state.code;lastRevision=state.revision;
 if(!old||old.round!==state.round){order=[];selected="";}
 else if(old.turn!==state.turn||old.phase!==state.phase){selected="";}
 if(old && old.revision!==state.revision){
  if(old.phase!=="won"&&state.phase==="won")sound("win");
  else if(state.hand.length>old.hand.length)sound("buy");
  else if(state.discardTop&&(!old.discardTop||state.discardTop.id!==old.discardTop.id))sound("discard");
  else if(old.phase==="lobby"&&state.phase==="turn")sound("deal");
 }
 render();
}
function beginAudioScheduler(){
 if(document.hidden||!audio.ctx||audio.ctx.state!=="running"||audio.timer)return;
 audio.time=audio.ctx.currentTime+0.08;
 audio.timer=setInterval(audioTick,115);
 audioTick();
}
function unlockAudioOnGesture(){
 if(!audio.ctx||audio.unlocked)return;
 // Um oscilador quase inaudível libera a saída Web Audio dentro do toque no iPhone.
 try{
  var ctx=audio.ctx,osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.frequency.setValueAtTime(440,ctx.currentTime);
  gain.gain.setValueAtTime(0.0001,ctx.currentTime);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.04);
  osc.onended=function(){osc.disconnect();gain.disconnect();};
  audio.unlocked=true;
 }catch(e){}
}
function audioStart(){
 try{
  if(document.hidden)return;
  // O Safari pode silenciar Web Audio no modo silencioso se a sessão ficar em "auto".
  if(window.navigator&&window.navigator.audioSession){
   try{
    var audioMode=voiceChat&&voiceChat.isListening()?"play-and-record":"playback";
    if(window.navigator.audioSession.type!==audioMode)window.navigator.audioSession.type=audioMode;
   }catch(e){}
  }
  if(audio.ctx&&audio.ctx.state==="closed"){audio.ctx=null;audio.unlocked=false;audio.timer=null;}
  if(!audio.ctx){
   var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   audio.ctx=new C();
   audio.unlocked=false;
   audio.ctx.onstatechange=function(){
    if(!audio.ctx)return;
    if(audio.ctx.state==="running")beginAudioScheduler();
    else {if(audio.ctx.state==="interrupted")audio.unlocked=false;audioPause();}
   };
  }
  unlockAudioOnGesture();
  if(audio.ctx.state==="running"){beginAudioScheduler();return;}
  // iOS usa "interrupted" ao alternar de app, além de "suspended".
  if((audio.ctx.state==="suspended"||audio.ctx.state==="interrupted")&&!audio.resuming){
   audio.resuming=true;
   setTimeout(function(){audio.resuming=false;},900);
   Promise.resolve(audio.ctx.resume()).then(function(){
    audio.resuming=false;
    if(audio.ctx&&audio.ctx.state==="running")beginAudioScheduler();
   }).catch(function(){audio.resuming=false;});
  }
 }catch(e){audio.resuming=false;}
}
function audioPause(){
 if(audio.timer){clearInterval(audio.timer);audio.timer=null;}
 // Evitar suspend() manual: versões do Safari podem não restabelecer a saída depois.
}
function tone(freq,at,duration,vol,wave){
 if(!audio.ctx)return;
 var osc=audio.ctx.createOscillator(),g=audio.ctx.createGain();
 osc.type=wave||"sine";osc.frequency.value=freq;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.03);g.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(g);g.connect(audio.ctx.destination);osc.start(at);osc.stop(at+duration+.03);osc.onended=function(){osc.disconnect();g.disconnect();};
}
function audioTick(){
 if(!audio.ctx||audio.ctx.state!=="running"||document.hidden)return;
 if(audio.time<audio.ctx.currentTime-0.12||audio.time>audio.ctx.currentTime+2)audio.time=audio.ctx.currentTime+0.04;
 var notes=[523.25,659.25,784,0,659.25,587.33,493.88,0,440,523.25,659.25,523.25,392,440,493.88,0];
 var duration=60/88/2;
 // Nunca acumular notas ao voltar de outra aba ou durante lentidão do celular.
 for(var queued=0;queued<3&&audio.time<audio.ctx.currentTime+.26;queued++){
  var i=audio.step%notes.length;
  var mix=voiceChat&&voiceChat.isListening()?0.62:1;
  if(notes[i])tone(notes[i],audio.time,.28,.068*mix,"triangle");
  if(i%8===0)tone(i===0?261.63:220,audio.time,1.65,.021*mix,"sine");
  audio.step++;audio.time+=duration;
 }
}
function sound(kind){if(!audio.ctx||audio.ctx.state!=="running")return;var t=audio.ctx.currentTime+.03;
 if(kind==="win"){[523,659,783,1046].forEach(function(f,i){tone(f,t+i*.12,.28,.10,"triangle");});}
 else if(kind==="discard"){tone(440,t,.10,.08,"triangle");tone(280,t+.065,.10,.07,"sine");}
 else if(kind==="buy"||kind==="deal"){tone(310,t,.075,.055,"triangle");tone(390,t+.045,.08,.03,"sine");}
 else if(kind==="ui"){tone(640,t,.070,.029,"sine");tone(790,t+.035,.06,.014,"sine");}
 else if(kind==="focus"){tone(520,t,.08,.018,"sine");}
 else if(kind==="type"){tone(720,t,.035,.008,"sine");}
}
// Navegadores móveis exigem um toque real para liberar música e efeitos.
// A música permanece associada à página e não à sala: recarregar não encerra a partida.
document.addEventListener("pointerdown",audioStart,{capture:true,passive:true});
document.addEventListener("touchstart",audioStart,{capture:true,passive:true});
document.addEventListener("keydown",function(){audioStart();},true);
document.addEventListener("focusin",function(e){
 if(e.target?.matches?.("input,textarea,select")){audioStart();sound("focus");}
},true);
document.addEventListener("visibilitychange",function(){
 if(document.hidden)audioPause();
 else if(audio.ctx)audioStart();
});
window.addEventListener("pageshow",function(){if(audio.ctx&&!document.hidden)audioStart();});
async function api(action,extra){
 var body=Object.assign({action:action,code:room,token:token},extra||{});
 var response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});
 var result=await response.json();
 if(!result.ok)throw new Error(result.error||"Não foi possível concluir a jogada.");
 return result;
}
async function doAction(action,extra){
 if(busy)return;busy=true;errText="";
 var epoch=sessionEpoch;
 try{
  audioStart();
  var result=await api(action,extra);
  if(epoch!==sessionEpoch)return;
  if(result.token){token=result.token;room=result.state.code;localStorage.setItem(STORAGE_KEY,JSON.stringify({code:room,token:token}));history.replaceState(null,"",link());}
  if(result.state)setState(result.state);
 }catch(e){if(epoch===sessionEpoch)showError(e.message);}
 finally{if(epoch===sessionEpoch){busy=false;render();}}
}
async function refresh(){
 if(polling||busy||!room||!token)return;polling=true;
 var epoch=sessionEpoch;
 try{
  var result=await api("state");
  if(epoch!==sessionEpoch)return;
  errText="";
  if(result.state.revision!==lastRevision||!game)setState(result.state);
 }catch(e){if(epoch===sessionEpoch){errText=e.message;render();}}
 finally{if(epoch===sessionEpoch)polling=false;}
}
async function shareInvite(){
 var url=link();
 try{if(navigator.share)await navigator.share({title:"Pif-Paf / Caxeta do Gael",text:"Entre na minha mesa online. Código: "+room,url:url});
 else if(navigator.clipboard) {await navigator.clipboard.writeText(url);noticeText="Link copiado para enviar aos amigos.";render();}
 else window.prompt("Copie o convite:",url);
 }catch(e){if(e.name!=="AbortError")showError("Não foi possível compartilhar. Copie o código da sala.");}
}
function copyCode(){
 if(navigator.clipboard)navigator.clipboard.writeText(room).then(function(){noticeText="Código copiado: "+room;render();}).catch(function(){window.prompt("Código da sala:",room);});
 else window.prompt("Código da sala:",room);
}
function reorder(from,to){
 var a=order.indexOf(from),b=order.indexOf(to);
 if(a<0||b<0||a===b)return;
 var item=order.splice(a,1)[0];order.splice(b,0,item);render();
}
function validDrop(){return game&&game.phase==="turn"&&game.turn===game.seat&&game.step==="discard"&&game.hand.length===10;}
function targetAt(x,y){
 var el=document.elementFromPoint(x,y);
 if(!el)return null;
 var drop=el.closest("[data-dropzone='discard']");
 if(drop&&validDrop())return {kind:"discard",node:drop};
 var c=el.closest(".hand .card[data-id]");
 return c?{kind:"card",node:c}:null;
}
function pointerClean(g){
 g.node.classList.remove("moving");g.node.style.removeProperty("--dx");g.node.style.removeProperty("--dy");
 if(g.target)g.target.node.classList.remove("target","over");
 try{if(g.node.hasPointerCapture(g.pid))g.node.releasePointerCapture(g.pid);}catch(e){}
}
app.addEventListener("pointerdown",function(e){
 if(e.button!==undefined&&e.button!==0)return;
 var el=e.target.closest(".hand .card[data-id]");if(!el||!game)return;
 drag={id:el.dataset.id,node:el,x:e.clientX,y:e.clientY,pid:e.pointerId,moved:false,target:null};
 try{el.setPointerCapture(e.pointerId);}catch(_){}
});
app.addEventListener("pointermove",function(e){
 var g=drag;if(!g||e.pointerId!==g.pid)return;
 var dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.moved&&Math.hypot(dx,dy)<9)return;
 g.moved=true;if(e.cancelable)e.preventDefault();
 g.node.classList.add("moving");g.node.style.setProperty("--dx",dx+"px");g.node.style.setProperty("--dy",dy+"px");
 if(g.target)g.target.node.classList.remove("target","over");
 g.target=targetAt(e.clientX,e.clientY);
 if(g.target&&g.target.node!==g.node)g.target.node.classList.add(g.target.kind==="discard"?"over":"target");
});
app.addEventListener("pointerup",function(e){
 var g=drag;if(!g||g.pid!==e.pointerId)return;drag=null;
 var dest=g.moved?targetAt(e.clientX,e.clientY):null;pointerClean(g);
 if(!g.moved)return;
 ignoreClick=true;setTimeout(function(){ignoreClick=false;},220);
 if(dest&&dest.kind==="discard"&&validDrop())doAction("discard",{cardId:g.id});
 else if(dest&&dest.kind==="card"&&dest.node.dataset.id!==g.id)reorder(g.id,dest.node.dataset.id);
 else render();
});
app.addEventListener("pointercancel",function(e){var g=drag;if(!g||g.pid!==e.pointerId)return;drag=null;pointerClean(g);});
app.addEventListener("click",function(e){
 var c=e.target.closest(".hand .card[data-id]");
 if(c){if(ignoreClick)return;selected=selected===c.dataset.id?"":c.dataset.id;render();return;}
 var btnNode=e.target.closest("[data-action]");if(!btnNode||btnNode.disabled)return;
 var action=btnNode.dataset.action;
 audioStart();
 if(voiceChat&&voiceChat.handle(action))return;
 if(action==="leave-room"){sound("ui");leaveRoom();return;}
 if(!game||game.phase==="lobby"||action==="share"||action==="copy-code")sound("ui");
 if(action==="create"||action==="join"){
  var name=document.getElementById("playername")?.value.trim()||"Jogador";
  localStorage.setItem("gael_online_name",name);
  if(action==="join"){
   var code=(document.getElementById("roomcode")?.value||"").toUpperCase().trim();
   if(code.length!==6){showError("Digite o código da sala com seis caracteres.");return;}
   room=code;
  }
  doAction(action,{name:name});return;
 }
 if(action==="share"){shareInvite();return;}
 if(action==="copy-code"){copyCode();return;}
 if(action==="draw-stock"){doAction("draw",{source:"stock"});return;}
 if(action==="draw-discard"){doAction("draw",{source:"discard"});return;}
 if(action==="discard"||action==="win"){if(!selected){showError("Selecione uma carta.");return;}doAction(action,{cardId:selected});return;}
 if(action==="start-only"){doAction("start",{fillBots:false});return;}
 if(action==="start-bots"){doAction("start",{fillBots:true});return;}
 if(["start","next-round","initial-win","claim","reject"].indexOf(action)>=0)doAction(action);
});
app.addEventListener("keydown",function(e){
 if((e.key==="Enter"||e.key===" ")&&e.target.matches(".hand .card[data-id]")){e.preventDefault();e.target.click();}
 if(e.key==="Enter"&&e.target.id==="roomcode"){e.preventDefault();app.querySelector('[data-action="join"]')?.click();}
});
try{
 var saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 var urlCode=new URLSearchParams(location.search).get("s");
 if(saved&&saved.code&&saved.token&&(!urlCode||saved.code===urlCode.toUpperCase())){room=saved.code;token=saved.token;}
}catch(_){}
if(room&&token){refresh();}
else showLanding();
window.addEventListener("resize",function(){if(game)render();});
window.addEventListener("pagehide",function(){if(voiceChat)voiceChat.leave();});
setInterval(function(){if(room&&token)refresh();var timer=document.getElementById("claim-timer");if(timer&&game&&game.pending)timer.textContent=Math.max(0,Math.ceil((game.pending.until-Date.now())/1000))+"s";},1200);
})();
</script></body></html>
