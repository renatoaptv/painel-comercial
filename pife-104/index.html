  <script>
(function (root) {
  'use strict';
  const SUITS = [
    { key: 'H', symbol: '♥', name: 'Copas', red: true },
    { key: 'D', symbol: '♦', name: 'Ouros', red: true },
    { key: 'C', symbol: '♣', name: 'Paus', red: false },
    { key: 'S', symbol: '♠', name: 'Espadas', red: false }
  ];
  const RANK_LABEL = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };
  const label = rank => RANK_LABEL[rank] || String(rank);
  function createDeck() {
    const cards = [];
    for (let deck = 0; deck < 2; deck++) {
      for (const suit of SUITS) {
        for (let rank = 1; rank <= 13; rank++) {
          cards.push({ id: `${deck}-${suit.key}-${rank}`, deck, suit: suit.key, symbol: suit.symbol, red: suit.red, rank, label: label(rank) });
        }
      }
    }
    return cards;
  }
  function shuffle(cards, random = Math.random) {
    const result = cards.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function isTrinca(cards) {
    return cards.length === 3 && cards.every(c => c.rank === cards[0].rank) && new Set(cards.map(c => c.suit)).size === 3;
  }
  function isSequence(cards) {
    if (cards.length < 3 || !cards.every(c => c.suit === cards[0].suit)) return false;
    const ranks = cards.map(c => c.rank);
    if (new Set(ranks).size !== cards.length) return false;
    const consecutive = nums => {
      const sorted = nums.slice().sort((a,b) => a-b);
      return sorted.every((v, i) => i === 0 || v === sorted[i-1] + 1);
    };
    if (consecutive(ranks)) return true;
    if (ranks.includes(1)) return consecutive(ranks.map(r => r === 1 ? 14 : r));
    return false;
  }
  function meldType(cards) {
    if (isTrinca(cards)) return 'Trinca';
    if (isSequence(cards)) return 'Sequência';

  }
  function winningPartition(cards) {
    if (cards.length !== 9 || new Set(cards.map(c => c.id)).size !== 9) return null;
    const memo = new Map();
    function solve(mask) {
      if (!mask) return [];
      if (memo.has(mask)) return memo.get(mask);
      const firstBit = mask & -mask;
      for (let sub = mask; sub; sub = (sub - 1) & mask) {
        if (!(sub & firstBit)) continue;
        const group = [];
        for (let i = 0; i < cards.length; i++) if (sub & (1 << i)) group.push(cards[i]);
        if (group.length < 3) continue;
        const type = meldType(group);
        if (!type) continue;
        const remaining = solve(mask ^ sub);
        if (remaining !== null) {
          const answer = [{ type, cards: group }, ...remaining];
          memo.set(mask, answer);
          return answer;
        }
      }
      memo.set(mask, null);
      return null;
    }
    return solve((1 << cards.length) - 1);
  }

    for (let i = 0; i < 10; i++) {
      const nine = cards.filter((_, j) => j !== i);

    }
    return winning;
  }

    if (cards.length !== 9 || !discarded) return null;
    return winningDiscardFromTen([...cards, discarded]).find(result => result.removed.id !== discarded.id) || null;
  }

  function winnerPanel() {

  function helpHtml() {
    return `<section class="rules-panel"><details ${state.help?'open':''}><summary>Regras da mesa · leia aqui</summary><ol><li>Quatro jogadores individuais, 104 cartas (2 baralhos de 52), 9 cartas para cada um e sem curingas.</li><li>No começo, o sistema sorteia quem começa; o distribuidor fica à direita no sentido de rotação da mesa.</li><li>Na rodada seguinte, o jogador que começou a anterior passa a ser o distribuidor. O próximo no sentido horário recebe a primeira carta e começa.</li><li>As cartas são distribuídas uma por uma, em sentido horário, até que todos tenham nove; as restantes ficam no bolo.</li><li>Trincas: mesmo valor e três naipes diferentes. Sequências: 3 a 9 cartas consecutivas do mesmo naipe; o Ás pode ser baixo (A-2-3) ou alto (Q-K-A).</li><li>Para bater, formam-se combinações válidas com exatamente nove cartas. Pode-se aproveitar o descarte de qualquer jogador para bater.</li><li>Arraste as cartas para organizar sua mão. Depois de comprar e ficar com dez cartas, arraste a carta até a faixa DESCARTAR acima da mão ou até a pilha de descarte na mesa. Um toque rápido também permite selecionar e descartar.</li><li>Apenas quem inicia a rodada pode recusar a primeira carta comprada do bolo: descarta essa carta e recebe outra. Isso vale só no seu primeiro turno.</li><li>No modo contra robôs, as outras três mãos são jogadas automaticamente; cada pessoa que abrir o link terá uma partida própria.</li><li>Ao terminar o bolo, esta versão encerra a rodada sem vencedor. A regra pode ser ajustada depois.</li></ol></details></section>`;
  }
  function render() {
    let body = '';

    else {
      body = board();
      if (state.phase === 'dealing') body += dealPanel();
      if (state.phase === 'inspection') body += inspectPanel();
      if (state.phase === 'turn') body += turnPanel();
      if (state.phase === 'claim') body += claimPanel();
      if (state.phase === 'won' || state.phase === 'exhausted') body += winnerPanel();
    }
    el.innerHTML = `<div class="wrap">${header()}${state.notice?`<div class="notice">${esc(state.notice)}</div>`:''}${body}${helpHtml()}<p class="smallprint">Pif-Paf / Caxeta do Gael · ${state.mode==='bots'?'1 jogador contra 3 robôs':'4 jogadores no mesmo aparelho'} · todas as mãos são individuais</p></div>`;
    scheduleAutomation();
  }
  function notice(message) { state.notice = message; render(); }
  function startGame() {
    ensureAudio();
    startMusic();
    const names = state.mode='bots' ? [(document.getElementById('name0')?.value||'').trim().slice(0,22)||'Você','Robô 1','Robô 2','Robô 3'] : state.names.map((name,i) => (document.getElementById('name'+i)?.value || '').trim().slice(0,22) || `Jogador ${i+1}`);
    state.names = names;
    state.round = 0;
    state.starter = Math.floor(Math.random() * 4);
    state.dealer = previous(state.starter);
    nextRound(true);
  }
  function nextRound(first=false) {
    state.dealToken++;
    if (!first) {
      state.dealer = state.starter;
      state.starter = next(state.dealer);
    }
    state.round++;
    state.deck = rules.shuffle(rules.createDeck());
    state.discard = [];
    state.hands = [[],[],[],[]];
    state.turn = state.starter;
    state.phase = 'dealing';
    state.dealingCount = 0;
    state.dealingTo = state.starter;
    state.visible = false;
    state.inspectionIndex = state.mode==='bots'?0:state.starter;
    state.inspected = 0;
    state.selectedId = null;
    state.organizeMode = false;
    state.organizeFirstId = null;
    state.openingTurn = true;
    state.specialUsed = false;
    state.pending = null;
    state.claimant = null;
    state.turnStep = 'draw';
    state.drawnId = null;
    state.drawSource = null;
    state.winner = null;
    state.winType = null;
    state.winDetail = '';
    state.winningGroups = null;
    state.winningCards = null;
    state.notice = '';
    const token = state.dealToken;
    render();
    function dealOne() {
      if (state.phase !== 'dealing' || token !== state.dealToken) return;
      const recipient = (state.starter + state.dealingCount) % 4;
      const card = state.deck.pop();
      state.hands[recipient].push(card);
      state.dealingTo = recipient;
      state.dealingCount++;
      if(state.dealingCount%4===1)playEffect('deal');
      render();
      if (state.dealingCount < 36) {
        setTimeout(dealOne, 48);
      } else {
        setTimeout(() => {
          if (state.phase !== 'dealing' || token !== state.dealToken) return;
          state.phase = 'inspection';
          state.dealingTo = null;
          state.inspectionIndex = state.mode==='bots'?0:state.starter;
          state.inspected = 0;
          render();
        }, 350);
      }
    }
    setTimeout(dealOne, 150);
  }
  function inspectNext() {
    state.visible = false;
    if (state.mode==='bots') {
      state.phase='turn';
      state.turn=state.starter;
      state.turnStep='draw';
      state.inspected=4;
      return render();
    }
    state.organizeMode = false;
    state.organizeFirstId = null;
    state.inspected++;
    if (state.inspected >= 4) {
      state.phase = 'turn';
      state.turn = state.starter;
      state.turnStep = 'draw';
    } else state.inspectionIndex = next(state.inspectionIndex);
    render();
  }
  function win(player, type, cards, groups, detail='') {
    state.winner = player;
    state.winType = type;
    state.winningCards = cards.slice();
    state.winningGroups = groups;
    state.winDetail = detail;
    state.phase = 'won';
    playEffect('win');
    state.visible = true;
    state.notice = '';
    render();
  }
  function draw(source) {
    if (state.phase !== 'turn' || state.turnStep !== 'draw' || (!state.visible && !isBot(state.turn))) return;
    let card;
    if (source === 'discard') {
      if (!state.discard.length) return notice('Não há carta no descarte.');
      card = state.discard.pop();
    } else {
      if (!state.deck.length) { state.phase = 'exhausted'; return render(); }
      card = state.deck.pop();
    }
    state.hands[state.turn].push(card);
    state.drawnId = card.id;
    state.drawSource = source;
    state.selectedId = null;
    state.organizeMode = false;
    state.organizeFirstId = null;
    state.turnStep = 'discard';
    state.notice = '';
    playEffect('buy');
    render();
  }
  function discardCard(isWin) {
    if (state.phase !== 'turn' || state.turnStep !== 'discard' || (!state.visible && !isBot(state.turn)) || !state.selectedId) return;
    const hand = state.hands[state.turn];
    const selected = hand.find(c=>c.id===state.selectedId);
    if (!selected) return;
    const nine = hand.filter(c => c.id !== selected.id);
    const groups = rules.winningPartition(nine);
    if (isWin) {
      if (!groups) return notice('As 9 cartas restantes ainda não formam uma batida válida.');
      state.hands[state.turn] = nine;
      state.discard.push(selected);
      return win(state.turn,'BATIDA',nine,groups,'9 cartas válidas');
    }
    state.hands[state.turn] = nine;
    state.organizeMode = false;
    state.organizeFirstId = null;
    state.discard.push(selected);
    playEffect('discard');
    state.pending = { card: selected, by: state.turn, after: 'next-turn' };
    state.claimant = next(state.turn);
    state.phase = 'claim';
    state.visible = false;
    state.selectedId = null;
    state.openingTurn = false;
    state.notice = '';
    render();
  }
  function rejectFirst() {
    const special = state.phase === 'turn' && state.turn === state.starter && state.openingTurn && !state.specialUsed && state.turnStep === 'discard' && state.drawSource === 'stock' && state.visible;
    if (!special) return;
    const hand = state.hands[state.turn];
    const bought = hand.find(c=>c.id === state.drawnId);
    if (!bought) return;
    state.hands[state.turn] = hand.filter(c=>c.id!==bought.id);
    state.discard.push(bought);
    playEffect('discard');
    state.specialUsed = true;
    state.pending = { card: bought, by: state.turn, after: 'replacement' };
    state.claimant = next(state.turn);
    state.phase = 'claim';
    state.visible = false;
    state.selectedId = null;
    state.organizeMode = false;
    state.organizeFirstId = null;
    state.notice = 'A primeira carta foi recusada. Antes da nova compra, qualquer adversário pode bater nesse descarte.';
    render();
  }
  function claim() {
    if (state.phase !== 'claim') return;
    const chooser = document.getElementById('claimant');
    const claimant = state.mode==='bots'?0:Number(chooser?.value);
    if (!Number.isInteger(claimant) || claimant<0 || claimant>3 || claimant === state.pending.by) return;
    state.claimant = claimant;
    const candidate = rules.claimDiscard(state.hands[claimant], state.pending.card);
    if (!candidate) return notice(`${state.names[claimant]} ainda não consegue formar uma batida válida com esta carta.`);
    const claimed = state.discard.pop();
    if (!claimed || claimed.id !== state.pending.card.id) throw new Error('Erro de consistência no descarte.');
    state.discard.push(candidate.removed);
    state.hands[claimant] = candidate.hand;
    return win(claimant,'BATIDA NO DESCARTE',candidate.hand,candidate.groups,`Pegou ${claimed.label} ${claimed.symbol} descartado por ${state.names[state.pending.by]}`);
  }
  function passClaim(forceAdvance=false) {
    if (state.phase !== 'claim') return;
    if (state.mode==='bots' && !forceAdvance && nextEligibleClaim()===0) {
      state.pending.skipHuman=true;
      return render();
    }
    state.organizeMode = false;
    state.organizeFirstId = null;
    const after = state.pending.after;
    if (after === 'replacement') {
      state.pending = null;
      state.phase = 'turn';
      state.turnStep = 'discard';
      state.visible = false;
      state.selectedId = null;
      if (!state.deck.length) {state.phase='exhausted';return render();}
      const card = state.deck.pop();
      state.hands[state.turn].push(card);
      playEffect('buy');
      state.drawnId = card.id;
      state.drawSource = 'replacement';
      state.notice = `${state.names[state.turn]} recebeu a segunda carta. Agora deve escolher uma carta para descartar ou bater.`;
      render();
      return;
    }
    state.turn = next(state.pending.by);
    state.turnStep = 'draw';
    state.drawnId = null;
    state.drawSource = null;
    state.specialUsed = state.specialUsed;
    state.selectedId = null;
    state.phase = 'turn';
    state.visible = false;
    state.pending = null;
    state.notice = '';
    render();
  }
  function reset() {
    if (autoTimer) clearTimeout(autoTimer);

  function toggleHelp() {

  let ignoreCardClick = false;
  let gesture = null;
  function canDragDiscard(){return state.phase==='turn' && state.turnStep==='discard' && state.visible && !isBot(state.turn) && state.hands[state.turn].length===10;}
  function dragTargetAt(x,y){
    const node=document.elementFromPoint(x,y);
    if (!node) return null;
    if (canDragDiscard() && node.closest('[data-dropzone="discard"]')) return {kind:'discard',node:node.closest('[data-dropzone="discard"]')};

  }
  el.addEventListener('pointerdown', event => {

    if (!node) return;
    gesture={id:node.dataset.card,pointerId:event.pointerId,x:event.clientX,y:event.clientY,moved:false,node,target:null};

  });
  el.addEventListener('pointermove', event => {
    const g=gesture;
    if (!g || event.pointerId!==g.pointerId) return;

    g.moved=true;
    if(event.cancelable)event.preventDefault();
    g.node.classList.add('dragging');
    g.node.style.setProperty('--drag-x',dx+'px');
    g.node.style.setProperty('--drag-y',dy+'px');
    if(g.target)g.target.node.classList.remove('drop-target','discard-target');
    g.target=dragTargetAt(event.clientX,event.clientY);
    if(g.target && g.target.node!==g.node)g.target.node.classList.add(g.target.kind==='discard'?'discard-target':'drop-target');
    if(event.pointerType==='touch' && event.clientY<65)window.scrollBy(0,-8);
    if(event.pointerType==='touch' && event.clientY>window.innerHeight-40)window.scrollBy(0,8);
  });
  function clearGesture(g){
    if(g.target)g.target.node.classList.remove('drop-target','discard-target');

  el.addEventListener('click', event => {

      else if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(()=>notice('Link copiado para compartilhar.')).catch(()=>window.prompt('Copie o link do jogo:',url));

    if (action === 'next-round') return nextRound();
    if (action === 'reveal') {state.visible=true;return render();}
    if (action === 'hide') {state.visible=false;state.organizeMode=false;state.organizeFirstId=null;return render();}
    if (action === 'toggle-organize') {
      if (!handToOrganize()) return;
      state.organizeMode = !state.organizeMode;
      state.organizeFirstId = null;
      state.selectedId = null;
      return render();
    }
    if (action === 'sort-rank' || action === 'sort-suit') return sortHand(action==='sort-suit'?'suit':'rank');
    if (action === 'inspect-next') return inspectNext();
    if (action === 'initial-win') {
      const hand=state.hands[state.inspectionIndex];
      const groups=rules.winningPartition(hand);
      if (state.phase==='inspection'&&state.visible&&groups) return win(state.inspectionIndex,'BATIDA NA DISTRIBUIÇÃO',hand,groups);
    }
    if (action === 'buy-stock') return draw('stock');
    if (action === 'buy-discard') return draw('discard');
    if (action === 'select-card') {
      if (ignoreCardClick) return;
      if (state.organizeMode && handToOrganize()) {
        if (!state.organizeFirstId) state.organizeFirstId = node.dataset.card;
        else if (state.organizeFirstId === node.dataset.card) state.organizeFirstId = null;
        else return moveCard(state.organizeFirstId,node.dataset.card);
        return render();
      }
      if (state.phase==='turn' && state.turnStep==='discard' && state.visible && !isBot(state.turn)) {state.selectedId=node.dataset.card;render();}
      return;
    }
    if (action === 'discard') return discardCard(false);
    if (action === 'win-after-discard') return discardCard(true);
    if (action === 'reject-first') return rejectFirst();
    if (action === 'claim') return claim();
    if (action === 'pass-claim') return passClaim();
  });
  el.addEventListener('keydown', event => {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action="select-card"]')) {
      event.preventDefault();event.target.click();
    }
  });
  el.addEventListener('change', event => {
    if (event.target.id === 'claimant') state.claimant = Number(event.target.value);
  });
  el.addEventListener('toggle', event => {
    if (event.target.matches('.rules-panel details')) state.help = event.target.open;
  },true);
  // Status de inspeção e regras disponível para testes automatizados em navegador.
  window.Pife104Debug = { state, rules };
  render();
})();

</script>
