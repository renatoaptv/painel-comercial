  <script>
(function (root) {
  'use strict';
  const SUITS = [
    { key: 'H', symbol: '♥', name: 'Copas', red: true },
    { key: 'D', symbol: '♦', name: 'Ouros', red: true },
    { key: 'C', symbol: '♣', name: 'Paus', red: false },
    { key: 'S', symbol: '♠', name: 'Espadas', red: false }
  ];
  const RANK_LABEL = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };
  const label = rank => RANK_LABEL[rank] || String(rank);
  function createDeck() {
    const cards = [];
    for (let deck = 0; deck < 2; deck++) {
      for (const suit of SUITS) {
        for (let rank = 1; rank <= 13; rank++) {
          cards.push({ id: `${deck}-${suit.key}-${rank}`, deck, suit: suit.key, symbol: suit.symbol, red: suit.red, rank, label: label(rank) });
        }
      }
    }
    return cards;
  }
  function shuffle(cards, random = Math.random) {
    const result = cards.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function isTrinca(cards) {
    return cards.length === 3 && cards.every(c => c.rank === cards[0].rank) && new Set(cards.map(c => c.suit)).size === 3;
  }
  function isSequence(cards) {
    if (cards.length < 3 || !cards.every(c => c.suit === cards[0].suit)) return false;
    const ranks = cards.map(c => c.rank);
    if (new Set(ranks).size !== cards.length) return false;
    const consecutive = nums => {
      const sorted = nums.slice().sort((a,b) => a-b);
      return sorted.every((v, i) => i === 0 || v === sorted[i-1] + 1);
    };
    if (consecutive(ranks)) return true;
    if (ranks.includes(1)) return consecutive(ranks.map(r => r === 1 ? 14 : r));
    return false;
  }
  function meldType(cards) {
    if (isTrinca(cards)) return 'Trinca';
    if (isSequence(cards)) return 'Sequência';
    return null;
  }
  function winningPartition(cards) {
    if (cards.length !== 9 || new Set(cards.map(c => c.id)).size !== 9) return null;
    const memo = new Map();
    function solve(mask) {
      if (!mask) return [];
      if (memo.has(mask)) return memo.get(mask);
      const firstBit = mask & -mask;
      for (let sub = mask; sub; sub = (sub - 1) & mask) {
        if (!(sub & firstBit)) continue;
        const group = [];
        for (let i = 0; i < cards.length; i++) if (sub & (1 << i)) group.push(cards[i]);
        if (group.length < 3) continue;
        const type = meldType(group);
        if (!type) continue;
        const remaining = solve(mask ^ sub);
        if (remaining !== null) {
          const answer = [{ type, cards: group }, ...remaining];
          memo.set(mask, answer);
          return answer;
        }
      }
      memo.set(mask, null);
      return null;
    }
    return solve((1 << cards.length) - 1);
  }
  function isLobaDoida(cards) {
    return cards.length === 9 && new Set(cards.map(c => c.rank)).size === 9;
  }
  function winningDiscardFromTen(cards) {
    if (cards.length !== 10) return [];
    const winning = [];
    for (let i = 0; i < 10; i++) {
      const nine = cards.filter((_, j) => j !== i);
      const groups = winningPartition(nine);
      if (groups) winning.push({ removed: cards[i], hand: nine, groups });
    }
    return winning;
  }
  function claimDiscard(cards, discarded) {
    if (cards.length !== 9 || !discarded) return null;
    return winningDiscardFromTen([...cards, discarded]).find(result => result.removed.id !== discarded.id) || null;
  }
  root.PifeRules = { SUITS, createDeck, shuffle, isTrinca, isSequence, meldType, winningPartition, isLobaDoida, winningDiscardFromTen, claimDiscard };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
(() => {

  };

  const num = n => String(n).padStart(2,'0');

  const currentHand = () => state.hands[state.phase === 'inspection' ? state.inspectionIndex : state.turn];

  function cardHtml(c, opts = {}) {

  }
  function backHtml() { return '<div class="card back" aria-label="Carta virada">✦</div>'; }
  function header() {
    return `<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">♠</div><div><h1>PIFE 104</h1><small>4 jogadores · Loba Doida</small></div></div><div class="top-actions">${state.phase !== 'setup' ? '<button class="btn ghost small" data-action="new-game">Novo jogo</button>' : ''}<button class="btn ghost small" data-action="toggle-help">Regras</button></div></header>`;
  }
  function setup() {
    return `<section class="intro"><div class="tagline">Baralho brasileiro · 104 cartas</div><h2>Uma mesa. Quatro jogadores. Um vencedor.</h2><p>O robô embaralha e distribui uma carta por vez. Cada jogador recebe nove cartas e joga individualmente. Passe o aparelho para o jogador da vez para manter as mãos em segredo.</p><div class="name-grid">${state.names.map((name,i) => `<label class="field">Jogador ${i+1}<input id="name${i}" maxlength="22" value="${esc(name)}" autocomplete="off" /></label>`).join('')}</div><div class="intro-actions"><button class="btn primary" data-action="start">Sortear e distribuir</button></div><hr class="setup-divider"/><p class="note"><strong>Esta primeira versão é local:</strong> quatro pessoas no mesmo celular ou computador, alternando a visualização das mãos. Não precisa de internet depois de abrir a página. O multiplayer em quatro aparelhos poderá ser a próxima etapa.</p></section>`;

  }
  function hidePanel(title, description) {
    return `<div class="private"><div class="tagline">Mão protegida</div><strong>${esc(title)}</strong><p class="note">${esc(description)} Mantenha a tela voltada apenas para o jogador indicado.</p><button class="btn primary" data-action="reveal">Mostrar minhas cartas</button></div>`;
  }
  function inspectPanel() {
    const player = state.inspectionIndex;
    const hand = state.hands[player];
    const step = state.inspected + 1;
    const title = `Conferência ${step} de 4: ${state.names[player]}`;
    let content = !state.visible ? hidePanel(state.names[player], 'Confira as 9 cartas recebidas antes de começar a rodada.') : `<div class="cards">${hand.map(c=>cardHtml(c)).join('')}</div><div class="special"><strong>LOBA DOIDA:</strong> válida apenas agora, com 9 valores diferentes, sem nenhum par. Se declarar, ganha imediatamente.</div><div class="controls"><button class="btn danger" data-action="loba" ${rules.isLobaDoida(hand)?'':'disabled'}>BATER LOBA DOIDA</button><button class="btn primary" data-action="initial-win" ${rules.winningPartition(hand)?'':'disabled'}>Bater com 9 cartas</button><button class="btn" data-action="inspect-next">Não vou bater · Próximo</button><button class="btn ghost" data-action="hide">Ocultar</button></div><p class="actions-info">${rules.isLobaDoida(hand)?'Você recebeu uma Loba Doida válida.':'Não há Loba Doida nesta mão.'} ${rules.winningPartition(hand)?'Também há uma combinação comum completa.':''}</p>`;
    return `<section class="gamepanel"><span class="turn-label">Antes da primeira compra</span><h2 class="phase-title">${esc(title)}</h2><p class="subheading">Cada jogador confere suas cartas separadamente. Ao confirmar, o aparelho passa ao próximo no sentido horário.</p>${content}</section>`;
  }
  function turnPanel() {
    const player = state.turn;
    if (!state.visible) return `<section class="gamepanel"><span class="turn-label">Vez de jogar</span><h2 class="phase-title">${esc(state.names[player])}</h2>${hidePanel(state.names[player], 'É sua vez. Confira sua mão sem mostrar aos adversários.')}</section>`;
    const hand = state.hands[player];
    const selected = hand.find(c => c.id === state.selectedId);
    const nineAfter = selected ? hand.filter(c => c.id !== selected.id) : null;
    const winningGroups = nineAfter ? rules.winningPartition(nineAfter) : null;
    const canSpecial = state.openingTurn && player === state.starter && !state.specialUsed && state.turnStep === 'discard' && state.drawSource === 'stock' && state.drawnId !== null && hand.some(c=>c.id===state.drawnId);
    let content = `<div class="cards" aria-label="Sua mão">${hand.map(c=>cardHtml(c,{clickable:state.turnStep==='discard',selected:state.selectedId})).join('')}</div>`;
    if (state.turnStep === 'draw') {
      content += `<div class="draw-box">Você tem <strong>9 cartas</strong>. Compre uma carta do bolo${state.discard.length?' ou pegue a última carta descartada':''}.</div><div class="controls"><button class="btn primary" data-action="buy-stock" ${state.deck.length?'':'disabled'}>Comprar do bolo</button>${state.discard.length?'<button class="btn" data-action="buy-discard">Pegar do descarte</button>':''}<button class="btn ghost" data-action="hide">Ocultar cartas</button></div>`;
    } else {
      content += `<div class="draw-box">Você está com <strong>10 cartas</strong>. Toque na carta que quer descartar; as outras nove devem formar sua batida.</div>${selected?`<p class="note">Carta selecionada para sair: <strong>${esc(selected.label)} ${selected.symbol}</strong> ${winningGroups? '· As outras 9 formam uma batida válida!':'· Ainda não forma uma batida com as outras 9.'}</p>`:'<p class="note">Selecione uma carta da sua mão acima.</p>'}<div class="controls"><button class="btn primary" data-action="win-after-discard" ${selected&&winningGroups?'':'disabled'}>BATER COM 9 CARTAS</button><button class="btn" data-action="discard" ${selected?'':'disabled'}>Descartar e passar</button>${canSpecial?'<button class="btn danger" data-action="reject-first">Recusar a 1ª carta e comprar outra</button>':''}<button class="btn ghost" data-action="hide">Ocultar</button></div>${canSpecial?'<p class="actions-info">Regra especial: só quem começou esta rodada pode recusar a primeira carta comprada. Ela vai ao descarte; em seguida, você recebe outra carta.</p>':''}`;
    }
    return `<section class="gamepanel"><span class="turn-label">Jogador da vez · ${state.turnStep==='draw'?'Comprar':'Descartar ou bater'}</span><h2 class="phase-title">${esc(state.names[player])}</h2><p class="subheading">${state.turnStep==='draw'?'Compre uma carta para jogar.':'Escolha uma carta para sair, ficando com nove na mão.'}</p>${content}</section>`;
  }
  function claimPanel() {
    const c = state.pending.card;
    return `<section class="gamepanel"><span class="turn-label">Descarte na mesa · Chance de batida</span><h2 class="phase-title">Alguém pode bater nesta carta?</h2><p class="subheading">${esc(state.names[state.pending.by])} descartou <strong>${esc(c.label)} ${c.symbol}</strong>. Qualquer outro jogador armado pode bater agora, mesmo fora da própria vez.</p><div class="claim-panel"><label class="field">Quem quer bater?<select id="claimant" class="claim-select">${state.names.map((n,i) => i === state.pending.by ? '' : `<option value="${i}" ${state.claimant===i?'selected':''}>${esc(n)}</option>`).join('')}</select></label><button class="btn danger" data-action="claim">Tentar bater neste descarte</button></div><div class="controls"><button class="btn primary" data-action="pass-claim">Ninguém bateu · Continuar</button></div><p class="actions-info">Para bater, o jogador usa a carta descartada e retira uma carta da própria mão, terminando com 9 cartas válidas. O jogo verifica a combinação sem exibir as cartas dos adversários.</p></section>`;
  }
  function winnerPanel() {
    if (state.phase === 'exhausted') return `<section class="gamepanel"><div class="winner"><div class="trophy">♠</div><h2>Bolo esgotado</h2><p class="winner-note">A rodada terminou sem vencedor porque não há mais cartas no bolo. Esta é uma regra provisória para a primeira versão.</p><button class="btn primary" data-action="next-round">Próxima rodada</button></div></section>`;
    const special = state.winType === 'LOBA DOIDA';
    const groupDisplay = state.winningGroups && !special ? `<div class="groups">${state.winningGroups.map(g=>`<div class="meld"><div class="meld-title">${esc(g.type)}</div><div class="cards">${g.cards.map(c=>cardHtml(c,{small:true})).join('')}</div></div>`).join('')}</div>` : '';
    return `<section class="gamepanel"><div class="winner"><div class="trophy">${special?'★':'♛'}</div><div class="tagline">Rodada encerrada · Vencedor</div><h2>${esc(state.names[state.winner])}</h2><p class="winner-note"><strong>${esc(state.winType)}</strong>${state.winDetail?' · '+esc(state.winDetail):''}</p><div class="cards">${state.winningCards.map(c=>cardHtml(c)).join('')}</div>${groupDisplay}<p class="note">Na próxima rodada, <strong>${esc(state.names[state.starter])}</strong> dará as cartas, e <strong>${esc(state.names[next(state.starter)])}</strong> será o primeiro a receber e jogar.</p><div class="controls" style="justify-content:center"><button class="btn primary" data-action="next-round">Jogar próxima rodada</button><button class="btn ghost" data-action="new-game">Reiniciar jogo</button></div></div></section>`;
  }
  function helpHtml() {
    return `<section class="rules-panel"><details ${state.help?'open':''}><summary>Regras da mesa · leia aqui</summary><ol><li>Quatro jogadores individuais, 104 cartas (2 baralhos de 52), 9 cartas para cada um e sem curingas.</li><li>No começo, o sistema sorteia quem começa; o distribuidor fica à direita no sentido de rotação da mesa.</li><li>Na rodada seguinte, o jogador que começou a anterior passa a ser o distribuidor. O próximo no sentido horário recebe a primeira carta e começa.</li><li>As cartas são distribuídas uma por uma, em sentido horário, até que todos tenham nove; as restantes ficam no bolo.</li><li>Trincas: mesmo valor e três naipes diferentes. Sequências: 3 a 9 cartas consecutivas do mesmo naipe; o Ás pode ser baixo (A-2-3) ou alto (Q-K-A).</li><li>Para bater, formam-se combinações válidas com exatamente nove cartas. Pode-se aproveitar o descarte de qualquer jogador para bater.</li><li>Loba Doida: nove valores diferentes na distribuição. Precisa ser declarada na conferência inicial, antes das compras; ganha imediatamente.</li><li>Apenas quem inicia a rodada pode recusar a primeira carta comprada do bolo: descarta essa carta e recebe outra. Isso vale só no seu primeiro turno.</li><li>Ao terminar o bolo, esta versão encerra a rodada sem vencedor. A regra pode ser ajustada depois.</li></ol></details></section>`;
  }
  function render() {
    let body = '';
    if (state.phase === 'setup') body = setup();
    else {
      body = board();
      if (state.phase === 'dealing') body += dealPanel();
      if (state.phase === 'inspection') body += inspectPanel();
      if (state.phase === 'turn') body += turnPanel();
      if (state.phase === 'claim') body += claimPanel();
      if (state.phase === 'won' || state.phase === 'exhausted') body += winnerPanel();
    }
    el.innerHTML = `<div class="wrap">${header()}${state.notice?`<div class="notice">${esc(state.notice)}</div>`:''}${body}${helpHtml()}<p class="smallprint">Pife 104 · versão local de demonstração · cada jogador vê apenas a própria mão</p></div>`;
  }
  function notice(message) { state.notice = message; render(); }
  function startGame() {
    const names = state.names.map((name,i) => (document.getElementById('name'+i)?.value || '').trim().slice(0,22) || `Jogador ${i+1}`);
    state.names = names;
    state.round = 0;
    state.starter = Math.floor(Math.random() * 4);
    state.dealer = previous(state.starter);
    nextRound(true);
  }
  function nextRound(first=false) {
    state.dealToken++;
    if (!first) {
      state.dealer = state.starter;
      state.starter = next(state.dealer);
    }
    state.round++;
    state.deck = rules.shuffle(rules.createDeck());
    state.discard = [];
    state.hands = [[],[],[],[]];
    state.turn = state.starter;
    state.phase = 'dealing';
    state.dealingCount = 0;
    state.dealingTo = state.starter;
    state.visible = false;
    state.inspectionIndex = state.starter;
    state.inspected = 0;
    state.selectedId = null;
    state.openingTurn = true;
    state.specialUsed = false;
    state.pending = null;
    state.claimant = null;
    state.turnStep = 'draw';
    state.drawnId = null;
    state.drawSource = null;
    state.winner = null;
    state.winType = null;
    state.winDetail = '';
    state.winningGroups = null;
    state.winningCards = null;
    state.notice = '';
    const token = state.dealToken;
    render();
    function dealOne() {
      if (state.phase !== 'dealing' || token !== state.dealToken) return;
      const recipient = (state.starter + state.dealingCount) % 4;
      const card = state.deck.pop();
      state.hands[recipient].push(card);
      state.dealingTo = recipient;
      state.dealingCount++;
      render();
      if (state.dealingCount < 36) {
        setTimeout(dealOne, 48);
      } else {
        setTimeout(() => {
          if (state.phase !== 'dealing' || token !== state.dealToken) return;
          state.phase = 'inspection';
          state.dealingTo = null;
          state.inspectionIndex = state.starter;
          state.inspected = 0;
          render();
        }, 350);
      }
    }
    setTimeout(dealOne, 150);
  }
  function inspectNext() {
    state.visible = false;
    state.inspected++;
    if (state.inspected >= 4) {
      state.phase = 'turn';
      state.turn = state.starter;
      state.turnStep = 'draw';
    } else state.inspectionIndex = next(state.inspectionIndex);
    render();
  }
  function win(player, type, cards, groups, detail='') {
    state.winner = player;
    state.winType = type;
    state.winningCards = cards.slice();
    state.winningGroups = groups;
    state.winDetail = detail;
    state.phase = 'won';
    state.visible = true;
    state.notice = '';
    render();
  }
  function draw(source) {
    if (state.phase !== 'turn' || state.turnStep !== 'draw' || !state.visible) return;
    let card;
    if (source === 'discard') {
      if (!state.discard.length) return notice('Não há carta no descarte.');
      card = state.discard.pop();
    } else {
      if (!state.deck.length) { state.phase = 'exhausted'; return render(); }
      card = state.deck.pop();
    }
    state.hands[state.turn].push(card);
    state.drawnId = card.id;
    state.drawSource = source;
    state.selectedId = null;
    state.turnStep = 'discard';
    state.notice = '';
    render();
  }
  function discardCard(isWin) {
    if (state.phase !== 'turn' || state.turnStep !== 'discard' || !state.visible || !state.selectedId) return;
    const hand = state.hands[state.turn];
    const selected = hand.find(c=>c.id===state.selectedId);
    if (!selected) return;
    const nine = hand.filter(c => c.id !== selected.id);
    const groups = rules.winningPartition(nine);
    if (isWin) {
      if (!groups) return notice('As 9 cartas restantes ainda não formam uma batida válida.');
      state.hands[state.turn] = nine;
      state.discard.push(selected);
      return win(state.turn,'BATIDA',nine,groups,'9 cartas válidas');
    }
    state.hands[state.turn] = nine;
    state.discard.push(selected);
    state.pending = { card: selected, by: state.turn, after: 'next-turn' };
    state.claimant = next(state.turn);
    state.phase = 'claim';
    state.visible = false;
    state.selectedId = null;
    state.openingTurn = false;
    state.notice = '';
    render();
  }
  function rejectFirst() {
    const special = state.phase === 'turn' && state.turn === state.starter && state.openingTurn && !state.specialUsed && state.turnStep === 'discard' && state.drawSource === 'stock' && state.visible;
    if (!special) return;
    const hand = state.hands[state.turn];
    const bought = hand.find(c=>c.id === state.drawnId);
    if (!bought) return;
    state.hands[state.turn] = hand.filter(c=>c.id!==bought.id);
    state.discard.push(bought);
    state.specialUsed = true;
    state.pending = { card: bought, by: state.turn, after: 'replacement' };
    state.claimant = next(state.turn);
    state.phase = 'claim';
    state.visible = false;
    state.selectedId = null;
    state.notice = 'A primeira carta foi recusada. Antes da nova compra, qualquer adversário pode bater nesse descarte.';
    render();
  }
  function claim() {
    if (state.phase !== 'claim') return;
    const chooser = document.getElementById('claimant');
    const claimant = Number(chooser?.value);
    if (!Number.isInteger(claimant) || claimant<0 || claimant>3 || claimant === state.pending.by) return;
    state.claimant = claimant;
    const candidate = rules.claimDiscard(state.hands[claimant], state.pending.card);
    if (!candidate) return notice(`${state.names[claimant]} ainda não consegue formar uma batida válida com esta carta.`);
    const claimed = state.discard.pop();
    if (!claimed || claimed.id !== state.pending.card.id) throw new Error('Erro de consistência no descarte.');
    state.hands[claimant] = candidate.hand;
    return win(claimant,'BATIDA NO DESCARTE',candidate.hand,candidate.groups,`Pegou ${claimed.label} ${claimed.symbol} descartado por ${state.names[state.pending.by]}`);
  }
  function passClaim() {
    if (state.phase !== 'claim') return;
    const after = state.pending.after;
    if (after === 'replacement') {
      state.pending = null;
      state.phase = 'turn';
      state.turnStep = 'discard';
      state.visible = false;
      state.selectedId = null;
      if (!state.deck.length) {state.phase='exhausted';return render();}
      const card = state.deck.pop();
      state.hands[state.turn].push(card);
      state.drawnId = card.id;
      state.drawSource = 'replacement';
      state.notice = `${state.names[state.turn]} recebeu a segunda carta. Agora deve escolher uma carta para descartar ou bater.`;
      render();
      return;
    }
    state.turn = next(state.pending.by);
    state.turnStep = 'draw';
    state.drawnId = null;
    state.drawSource = null;
    state.specialUsed = state.specialUsed;
    state.selectedId = null;
    state.phase = 'turn';
    state.visible = false;
    state.pending = null;
    state.notice = '';
    render();
  }
  function reset() {
    state.dealToken++;
    state.phase='setup';
    state.notice='';
    state.visible=false;
    render();
  }
  function toggleHelp() {
    state.help = !state.help;
    const d = document.querySelector('.rules-panel details');
    if (d) d.open = state.help;
  }
  el.addEventListener('click', event => {
    const node = event.target.closest('[data-action]');
    if (!node || node.hasAttribute('disabled')) return;
    const action = node.dataset.action;
    if (action === 'toggle-help') return toggleHelp();
    if (action === 'start') return startGame();
    if (action === 'new-game') return reset();
    if (action === 'next-round') return nextRound();
    if (action === 'reveal') {state.visible=true;return render();}
    if (action === 'hide') {state.visible=false;return render();}
    if (action === 'inspect-next') return inspectNext();
    if (action === 'loba') {
      const hand=state.hands[state.inspectionIndex];
      if (state.phase==='inspection'&&state.visible&&rules.isLobaDoida(hand)) return win(state.inspectionIndex,'LOBA DOIDA',hand,null,'Declarada na conferência inicial, antes de comprar');
    }
    if (action === 'initial-win') {
      const hand=state.hands[state.inspectionIndex];
      const groups=rules.winningPartition(hand);
      if (state.phase==='inspection'&&state.visible&&groups) return win(state.inspectionIndex,'BATIDA NA DISTRIBUIÇÃO',hand,groups);
    }
    if (action === 'buy-stock') return draw('stock');
    if (action === 'buy-discard') return draw('discard');
    if (action === 'select-card') { if(state.phase==='turn'&&state.turnStep==='discard'&&state.visible){state.selectedId=node.dataset.card;render();} return; }
    if (action === 'discard') return discardCard(false);
    if (action === 'win-after-discard') return discardCard(true);
    if (action === 'reject-first') return rejectFirst();
    if (action === 'claim') return claim();
    if (action === 'pass-claim') return passClaim();
  });
  el.addEventListener('keydown', event => {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action="select-card"]')) {
      event.preventDefault();event.target.click();
    }
  });
  el.addEventListener('change', event => {
    if (event.target.id === 'claimant') state.claimant = Number(event.target.value);
  });
  el.addEventListener('toggle', event => {
    if (event.target.matches('.rules-panel details')) state.help = event.target.open;
  },true);
  // Status de inspeção e regras disponível para testes automatizados em navegador.
  window.Pife104Debug = { state, rules };
  render();
})();

</script>
</body>
</html>
