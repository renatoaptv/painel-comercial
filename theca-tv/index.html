<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1725">
  <meta name="description" content="THECA TV: três canais, três botões. Simples para toda a família.">
  <title>THECA TV — Escolha um canal</title>
  <link rel="canonical" href="https://renatoaptv.github.io/painel-comercial/theca-tv/">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0c1725;color:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;width:100%}
    body{min-height:100vh;min-height:100dvh;background:#0c1725;display:flex}
    .screen{width:min(1500px,100%);margin:auto;padding:clamp(18px,4vh,45px) clamp(18px,5vw,80px);display:flex;flex-direction:column;align-items:center;gap:clamp(30px,5vh,65px)}
    .brand{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,24px);min-height:92px}
    .brand-title{margin:0;line-height:1;font-size:clamp(35px,4vw,64px);font-weight:900;letter-spacing:-.025em}
    .brand-title span{color:#7fe8c3}
    .mascot{width:clamp(72px,7.7vw,108px);height:clamp(72px,7.7vw,108px);object-fit:cover;object-position:center 20%;border-radius:50%;border:3px solid #dbeae7;background:#d8efe1}
    .channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,32px);width:100%}
    .channel{display:flex;flex-direction:column;gap:clamp(14px,2vw,27px);align-items:center;justify-content:center;min-height:clamp(215px,32vh,355px);border-radius:24px;border:4px solid transparent;text-decoration:none;color:#fff;text-align:center;box-shadow:0 9px 22px rgba(0,0,0,.22);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
    .channel-name{font-size:clamp(35px,3.3vw,58px);font-weight:900;line-height:1.15;letter-spacing:-.025em}
    .channel-symbol{display:grid;place-items:center;width:clamp(89px,8.5vw,118px);height:clamp(89px,8.5vw,118px);flex:none;border-radius:50%;font-size:clamp(45px,4.3vw,64px);line-height:1;font-weight:900;box-shadow:inset 0 0 0 4px rgba(255,255,255,.45),0 9px 20px rgba(0,0,0,.18);color:#fff}
    .globo{background:#135c54}
    .globo .channel-symbol{background:radial-gradient(circle at 30% 25%,#9bf6df 0%,#20b69b 43%,#0c6559 100%);text-shadow:0 2px 5px #03544666}
    .sbt{background:#21538c}
    .sbt .channel-symbol{background:linear-gradient(135deg,#fce775 0%,#ef6a8a 45%,#449cf4 82%);text-shadow:0 2px 6px #29385066}
    .record{background:#784655}
    .record .channel-symbol{background:linear-gradient(135deg,#9ed8fa 0%,#5289cf 48%,#a85c7f 100%);text-shadow:0 2px 5px #30375866}
    .channel:hover{border-color:#fff}
    .channel:focus-visible,.channel.selected{outline:6px solid #fff;outline-offset:5px;border-color:#fff;box-shadow:0 0 0 13px #ffffff23;transform:translateY(-3px)}
    .channel:active{transform:scale(.98)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:800px){
      .screen{padding:20px 20px 30px;gap:30px}
      .brand{min-height:70px}
      .brand-title{font-size:clamp(32px,7vw,50px)}
      .mascot{width:74px;height:74px}
      .channels{grid-template-columns:1fr;max-width:520px;gap:15px}
      .channel{min-height:clamp(110px,19vh,155px);flex-direction:row;justify-content:flex-start;gap:clamp(18px,5vw,27px);padding:15px 24px;border-radius:20px}
      .channel-symbol{width:clamp(68px,19vw,85px);height:clamp(68px,19vw,85px);font-size:clamp(35px,11vw,48px)}
      .channel-name{font-size:clamp(30px,7vw,42px)}
    }
    @media(max-height:510px) and (min-width:801px){
      .screen{gap:18px}
      .channel{min-height:160px}
      .channel-symbol{height:74px;width:74px;font-size:39px}
      .channel-name{font-size:35px}
      .mascot{height:70px;width:70px}
      .brand-title{font-size:37px}
    }
    @media(prefers-reduced-motion:reduce){.channel{transition:none}}
  </style>
</head>

  <script>
    (function(){
      "use strict";
      var items=Array.prototype.slice.call(document.querySelectorAll(".channel"));
      var index=0,keyboard=false;
      function select(i){
        index=(i+items.length)%items.length;
        items.forEach(function(el,j){el.classList.toggle("selected",keyboard&&j===index)});
        items[index].focus({preventScroll:true});
      }
      document.addEventListener("keydown",function(event){
        var key=event.key;
        if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(key)!==-1){
          event.preventDefault();keyboard=true;
          var active=items.indexOf(document.activeElement);
          var previous=active===-1?index:active;
          select(previous+((key==="ArrowLeft"||key==="ArrowUp")?-1:1));
        }else if(["1","2","3"].indexOf(key)!==-1){
          event.preventDefault();keyboard=true;select(Number(key)-1);
        }else if((key===" "||key==="Enter")&&items.indexOf(document.activeElement)!==-1){
          if(key===" "){event.preventDefault();document.activeElement.click()}
        }
      });
      items.forEach(function(el,i){
        el.addEventListener("focus",function(){index=i});
        el.addEventListener("pointerdown",function(){keyboard=false;items.forEach(function(c){c.classList.remove("selected")})});
      });
      window.addEventListener("load",function(){
        if(!("ontouchstart" in window)){keyboard=true;select(0)}
      });
    })();
  </script>
