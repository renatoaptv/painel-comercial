<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d23"><title>Atendimento · Pif-Paf</title><style>*{box-sizing:border-box}body{background:#102d23;color:#f5f1e7;margin:0;font:15px system-ui}main{max-width:600px;margin:auto;padding:22px 16px 40px}a{color:#e6c78c}h1{font:36px Georgia;color:#e6c78c}section,form{background:#17392b;border:1px solid #527361;border-radius:15px;padding:16px;margin:15px 0}label{display:block;margin:10px 0 6px}select,textarea,button{font:inherit;background:#102d23;color:#f5f1e7;border:1px solid #527361;border-radius:9px;padding:11px;width:100%}textarea{min-height:120px;resize:vertical}button{background:#e6c78c;color:#102d23;font-weight:700;cursor:pointer;margin-top:10px}button:disabled{opacity:.6}p,small{color:#c4d6ca;line-height:1.5}article{border-top:1px solid #527361;padding:14px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap}h2{font-size:18px}header{display:flex;justify-content:space-between}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid white;outline-offset:2px}[hidden]{display:none!important}</style></head><body><main><header><a href="./">♠ Pif-Paf</a><a href="./configuracoes.html">Configurações</a></header><h1 id="title">Atendimento</h1><p id="status" role="status" aria-live="polite">Conectando…</p><p id="login" hidden><a href="./conta.html">Entre na sua conta</a> para abrir ou consultar chamados.</p><form id="form" hidden><h2>Novo chamado</h2><label for="category">Assunto</label><select id="category"><option value="conta">Minha conta</option><option value="partida">Partida / comportamento de jogador</option><option value="pagamento">Compra, cancelamento ou reembolso</option><option value="privacidade">Direitos sobre meus dados pessoais</option><option value="outro">Outro</option></select><label for="message">Descreva o que aconteceu</label><textarea id="message" minlength="10" maxlength="2000" required></textarea><p>Não informe senhas, códigos de acesso ou dados completos do cartão.</p><button>Enviar chamado</button></form><section id="section" hidden><h2 id="listTitle">Meus chamados</h2><div id="list"></div><button id="reload">Atualizar</button></section><p><a href="./termos.html">Termos e privacidade</a></p></main><script type="module">
import {sb,loadPlayerIdentity} from './shop-api.js';
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s,admin=new URLSearchParams(location.search).get('admin')==='1';let busy=false;
function el(tag,t){const e=document.createElement(tag);e.textContent=t;return e;}
async function rpc(p_action,args={}){const {data,error}=await sb.rpc('gael_v2_support',{p_action,...args});if(error)throw error;return data;}
function render(rows){const list=$('list');list.replaceChildren();for(const r of rows){const a=document.createElement('article');a.append(el('strong',(admin?r.nickname+' · ':'')+r.category+' · '+(r.response?'Respondido':'Aguardando resposta')),el('small',' · '+new Date(r.created_at).toLocaleString('pt-BR')),el('p',r.message));if(r.response)a.append(el('strong','Resposta da equipe'),el('p',r.response));if(admin){const b=el('button',r.response?'Atualizar resposta':'Responder');b.type='button';b.onclick=async()=>{const msg=prompt('Resposta ao jogador:',r.response||'');if(msg===null)return;if(msg.trim().length<3||msg.length>2000){say('Resposta de 3 a 2.000 caracteres.');return;}if(busy)return;busy=true;try{await rpc('reply',{p_ticket:r.id,p_message:msg});say('Resposta enviada.');await load();}catch(e){say(e.message);}finally{busy=false;}};a.append(b);}list.append(a);}if(!rows.length)list.append(el('p','Nenhum chamado.'));}
async function load(){try{const rows=await rpc(admin?'admin-list':'list');render(rows);$('section').hidden=false;if(!admin)$('form').hidden=false;}catch(e){say(admin?'Acesso administrativo restrito.':e.message||'Não foi possível carregar.');}}
$('reload').onclick=load;$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;e.submitter.disabled=true;try{await rpc('create',{p_category:$('category').value,p_message:$('message').value});$('message').value='';say('Chamado recebido. Consulte a resposta nesta página.');await load();}catch(e){say(e.message||'Não foi possível enviar.');}finally{busy=false;e.submitter.disabled=false;}};
(async()=>{try{const {data:{user}}=await sb.auth.getUser();if(!user){$('login').hidden=false;say('Você precisa estar conectado.');return;}if(!admin&&!await loadPlayerIdentity())throw Error('Abra o seu perfil antes de continuar.');if(admin){$('title').textContent='Central administrativa de atendimento';$('listTitle').textContent='Chamados dos jogadores';}say('');await load();}catch(e){say(e.message||'Não foi possível conectar.');}})();
</script></body></html>
