<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta · Pif-Paf</title><style>*{box-sizing:border-box}body{margin:0;background:#102d23;color:#f5f1e7;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,440px);padding:24px}h1{font:38px Georgia;color:#e6c78c;margin:20px 0 8px}p{color:#bdd0c4;font-size:14px;line-height:1.5}label{display:block;margin:12px 0 5px}input,button,a.btn{width:100%;padding:13px;border:1px solid #527361;border-radius:10px;font:inherit;display:block;margin:8px 0}input{background:#071e16;color:white}button,a.btn{background:#e6c78c;color:#102d23;font-weight:650;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:default}a{color:#e6c78c}small{color:#bdd0c4}.pack{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #527361}[hidden]{display:none!important}</style><main><a href="./">← Início</a><h1>Minha conta</h1><p>Caxeta do Gael · 1 G-COIN gratuita de teste após confirmação do e-mail.</p><form id="form"><label for="nickname">Apelido</label><input id="nickname" maxlength="24" minlength="2" autocomplete="nickname"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email" maxlength="254" pattern="[^\\s@]+@[^\\s@]+\\.[^\\s@]+" title="Informe um e-mail válido, como nome@exemplo.com"><label for="pw">Senha</label><input id="pw" type="password" minlength="8" required autocomplete="current-password"><button type="submit" value="login">Entrar</button><button type="submit" value="signup">Criar conta</button><button type="button" id="resend">Reenviar confirmação de e-mail</button></form><section id="profile" hidden><h2 id="who"></h2><p id="balance"></p><a class="btn" href="./loja.html">Loja G-COIN</a><a class="btn" href="../pife-104/online.html">Jogar no multiplayer original</a><p>As partidas originais ainda não utilizam esta carteira.</p><button id="logout">Sair</button></section><p id="status" role="status" aria-live="polite"></p></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const sb=createClient('https://tlzshlerpspgpjaqskdg.supabase.co','sb_publishable_LQRp4_juiOoAobJmNqU1rQ_YCt84lEQ',{auth:{storageKey:'gael-v2-auth'}});const $=id=>document.getElementById(id),say=s=>{$('status').textContent=s};function validEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)&&email.length<=254} function friendly(err){if(err.code==='email_not_confirmed')return 'Seu e-mail ainda não foi confirmado. Abra o link recebido ou solicite o reenvio.';if(err.code==='email_address_invalid'||err.code==='validation_failed')return 'Informe um endereço de e-mail válido.';if(err.status===429)return 'Muitas tentativas. Aguarde antes de solicitar novamente.';return err.message||'Não foi possível concluir a solicitação.'} $('resend').onclick=async()=>{const email=$('email').value.trim();if(!validEmail(email)){say('Informe um e-mail válido para reenviar a confirmação.');return}const b=$('resend');b.disabled=true;try{const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;say('Se houver uma confirmação pendente, confira sua caixa de entrada e spam.')}catch(err){say(friendly(err))}finally{b.disabled=false}};async function show(){const {data:{user},error}=await sb.auth.getUser();if(error||!user)return;if(!user.email_confirmed_at){say('Confirme seu e-mail antes de entrar.');return}const nickname=String(user.user_metadata?.gael_nickname||$('nickname').value||'Jogador').trim().slice(0,24);const {data,error:err}=await sb.rpc('gael_v2_account',{p_nickname:nickname.length>=2?nickname:'Jogador'});if(err){say('Não foi possível abrir a carteira. '+err.message);return}$('form').hidden=true;$('profile').hidden=false;$('who').textContent=data.nickname;$('balance').textContent=data.test_balance+' G-COIN(s) de teste';say('')} $('form').onsubmit=async e=>{e.preventDefault();const buttons=$('form').querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const email=$('email').value.trim(),password=$('pw').value,nickname=$('nickname').value.trim();if(!validEmail(email))throw Error('Informe um e-mail válido.');if(e.submitter.value==='signup'){if(nickname.length<2)throw Error('Informe seu apelido.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{gael_nickname:nickname},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;say('Confirme sua conta pelo link enviado ao e-mail. Confira também a pasta de spam. Depois, volte para entrar.');if(data.session)await show()}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await show()}}catch(err){say(friendly(err))}finally{buttons.forEach(b=>b.disabled=false)}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};show().catch(()=>say('Não foi possível conectar ao servidor.'));</script></html>
