<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d23"><title>Partidas · Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#102d23;color:#f5f1e7;font:15px system-ui}main{max-width:800px;margin:auto;padding:20px 16px 40px}a{color:#e6c78c}h1{font:36px Georgia;color:#e6c78c}p,small{color:#c4d6ca}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,article{background:#17392b;border:1px solid #527361;border-radius:12px;padding:14px}.card strong{display:block;font-size:25px;color:#e6c78c}article{margin:10px 0}article small{display:block;margin-top:5px}button{background:#e6c78c;color:#102d23;font:700 15px system-ui;padding:10px 16px;border:0;border-radius:10px;cursor:pointer}[hidden]{display:none!important}</style></head><body><main><a href="./admin.html">‹ Administração</a><h1>Monitor de partidas</h1><p id="status" role="status">Conectando…</p><div id="content" hidden><button id="reload">Atualizar</button><p>Informações administrativas; não mostra cartas, tokens ou senhas.</p><div class="metrics" id="metrics"></div><h2>Salas recentes</h2><div id="rooms"></div><p>Salas em andamento podem estar aguardando reconexão. Presença indica atividade na tela de amigos nos últimos 90 segundos.</p></div></main><script type="module">import {sb} from './shop-api.js';const $=id=>document.getElementById(id);let busy=false;function el(t,s){const e=document.createElement(t);e.textContent=s;return e;}async function load(){if(busy)return;busy=true;try{const {data,error}=await sb.rpc('gael_v2_admin_game_monitor');if(error)throw error;const m=$('metrics');m.replaceChildren();for(const [key,label] of [['players','Jogadores cadastrados'],['recent_friends','Ativos na área de amigos'],['waiting','Salas aguardando'],['playing','Partidas em andamento'],['finished','Partidas liquidadas'],['open_tickets','Chamados pendentes']]){const c=el('div','');c.className='card';c.append(el('strong',Number(data[key]||0).toLocaleString('pt-BR')),el('span',label));m.append(c);}const rooms=$('rooms');rooms.replaceChildren();for(const r of data.rooms||[]){const a=el('article','');a.append(el('strong',r.code+' · '+(r.reserved?'Reservada':'Pública')),el('small',({lobby:'Aguardando',turn:'Em jogo',claim:'Descarte'})[r.phase]||r.phase),el('small',r.participants+'/'+(r.target||'—')+' jogadores · '+(r.stake||'—')+' créditos gratuitos'),el('small','Atualização: '+new Date(r.updated_at).toLocaleString('pt-BR')));rooms.append(a);}if(!rooms.children.length)rooms.append(el('p','Nenhuma sala recente.'));$('content').hidden=false;$('status').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');}catch{$('content').hidden=true;$('status').textContent='Acesso administrativo restrito ou serviço indisponível.';}finally{busy=false;}}$('reload').onclick=load;setInterval(()=>{if(!document.hidden)load()},15000);load();</script></body></html>
